# XcodeGen Project Specification for Moments
# Run: xcodegen generate

name: Moments
options:
  bundleIdPrefix: com.sbuffose
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: R56Y2GZ2M9
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: "YES"

packages:
  MomentsEngine:
    path: ./MomentsEngine

targets:
  Moments:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Moments/Sources
        type: group
      - path: Moments/Resources
        type: group
    resources:
      - path: Moments/Resources/Assets.xcassets
      - path: Moments/Resources/es-AR.lproj
      - path: Moments/Resources/en.lproj
    info:
      path: Moments/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: es-AR
        CFBundleDisplayName: Moments
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Moments necesita acceso a tu biblioteca de fotos para analizar y organizar tus recuerdos. Todo el procesamiento se realiza en tu dispositivo de forma privada."
        NSPhotoLibraryAddUsageDescription: "Moments puede guardar fotos editadas en tu biblioteca."
        NSLocationWhenInUseUsageDescription: "Moments usa tu ubicación actual para identificar tu ubicación habitual y detectar viajes en tus fotos."
        NSFaceIDUsageDescription: "Moments puede usar Face ID para proteger el acceso a fotos privadas."
        NSContactsUsageDescription: "Moments puede importar cumpleaños de tus contactos para recordarte fechas importantes. Todo se procesa localmente."
        NSCalendarsUsageDescription: "Moments puede agregar fechas importantes a tu calendario para que no las olvides."
        NSCalendarsWriteOnlyAccessUsageDescription: "Moments puede agregar fechas importantes a tu calendario para que no las olvides."
        NSUserNotificationsUsageDescription: "Moments puede enviarte recordatorios antes de los cumpleaños y aniversarios de tus amigos."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.moments
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Moments/Preview Content"'
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Moments/Resources/Info.plist
    dependencies:
      - package: MomentsEngine
    entitlements:
      path: Moments/Moments.entitlements

  MomentsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MomentsUITests
        type: group
    info:
      properties:
        CFBundleDevelopmentRegion: es-AR
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.moments.uitests
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - target: Moments

  MomentsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MomentsTests
        type: group
        optional: true
    info:
      properties:
        CFBundleDevelopmentRegion: es-AR
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.moments.tests
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Moments

schemes:
  Moments:
    build:
      targets:
        Moments: all
        MomentsUITests: [test]
        MomentsTests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: IDEPreferLogStreaming
          value: "YES"
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: MomentsUITests
          parallelizable: false
          randomExecutionOrder: false
        - name: MomentsTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
