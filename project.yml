# XcodeGen Project Specification for Moments
# Run: xcodegen generate

name: Moments
options:
  bundleIdPrefix: com.sbuffose
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: R56Y2GZ2M9
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: "YES"

packages:
  MomentsEngine:
    path: ./MomentsEngine

targets:
  Moments:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Moments/Sources
        type: group
      - path: Moments/Resources
        type: group
    resources:
      - path: Moments/Resources/Assets.xcassets
      - path: Moments/Resources/es-AR.lproj
      - path: Moments/Resources/en.lproj
    info:
      properties:
        CFBundleDevelopmentRegion: es-AR
        CFBundleDisplayName: Moments
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Moments necesita acceso a tu biblioteca de fotos para analizar y organizar tus recuerdos. Todo el procesamiento se realiza en tu dispositivo de forma privada."
        NSPhotoLibraryAddUsageDescription: "Moments puede guardar fotos editadas en tu biblioteca."
        NSLocationWhenInUseUsageDescription: "Moments usa tu ubicación actual para identificar tu ubicación habitual y detectar viajes en tus fotos."
        NSFaceIDUsageDescription: "Moments puede usar Face ID para proteger el acceso a fotos privadas."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.moments
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Moments/Preview Content"'
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: MomentsEngine

schemes:
  Moments:
    build:
      targets:
        Moments: all
    run:
      config: Debug
      environmentVariables:
        - variable: IDEPreferLogStreaming
          value: "YES"
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
