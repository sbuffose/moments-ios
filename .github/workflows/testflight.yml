name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SCHEME: Moments
  BUNDLE_ID: com.sbuffose.moments
  TEAM_ID: R56Y2GZ2M9

jobs:
  build-and-deploy:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          # Update build number to GitHub run number
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate
          echo "Project generated with build number ${{ github.run_number }}"

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          
          # Try multiple approaches to convert the key to proper format
          # Approach 1: Use awk to replace literal backslash-n with newlines
          echo "$ASC_PRIVATE_KEY" | awk '{gsub(/\\n/,"\n")}1' | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          
          # Validate key file structure (without exposing content)
          echo "=== Key file validation ==="
          echo "File size: $(wc -c < "$KEY_FILE") bytes"
          echo "Line count: $(wc -l < "$KEY_FILE") lines"
          
          # Check for proper PEM structure
          if head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "✓ Has BEGIN PRIVATE KEY header"
          else
            echo "✗ Missing BEGIN PRIVATE KEY header"
            echo "First line starts with: $(head -1 "$KEY_FILE" | cut -c1-20)..."
            exit 1
          fi
          
          if tail -1 "$KEY_FILE" | grep -q "END PRIVATE KEY"; then
            echo "✓ Has END PRIVATE KEY footer"
          else
            echo "✗ Missing END PRIVATE KEY footer"
            exit 1
          fi
          
          # Verify line count is reasonable (should be 5-8 lines for a valid p8 key)
          LINE_COUNT=$(wc -l < "$KEY_FILE")
          if [ "$LINE_COUNT" -lt 3 ]; then
            echo "✗ Key file has too few lines ($LINE_COUNT). Expected multi-line PEM format."
            echo ""
            echo "IMPORTANT: The ASC_PRIVATE_KEY secret must be set correctly."
            echo "Go to: GitHub repo Settings > Secrets > Actions > ASC_PRIVATE_KEY"
            echo "Delete the current secret and create a new one."
            echo ""
            echo "Copy the ENTIRE contents of your AuthKey_XXXXXX.p8 file,"
            echo "including the -----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines."
            echo "Paste it directly into the secret value (GitHub preserves newlines)."
            exit 1
          fi
          
          echo "=== Key file structure OK ==="

      - name: Build and Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Moments.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Moments.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcpretty --color

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          EOF
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Moments.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcpretty --color

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Moments.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moments-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Moments.xcarchive
          retention-days: 14

      - name: Clean up API key
        if: always()
        run: rm -rf ~/private_keys
