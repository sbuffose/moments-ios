name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SCHEME: Moments
  BUNDLE_ID: com.sbuffose.moments
  TEAM_ID: R56Y2GZ2M9
  PROFILE_NAME: "Moments AppStore GHA"
  PROFILE_UUID: "e32b0b74-6a42-45fe-9652-75ba4c9d7537"

jobs:
  build-and-deploy:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          # Ensure build number is higher than 16 (previous TestFlight build)
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate
          echo "Project generated with build number $BUILD_NUMBER"

      - name: Setup Keychain and Import Certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          
          security import "$CERT_PATH" \
            -P "$DIST_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          
          rm "$CERT_PATH"
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -5
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"
          
          PROFILE_PATH="$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          
          echo "=== Provisioning profile installed ==="
          echo "Path: $PROFILE_PATH"
          echo "Size: $(wc -c < "$PROFILE_PATH") bytes"

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          
          echo "$ASC_PRIVATE_KEY" | awk '{gsub(/\\n/,"\n")}1' | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          
          if head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "✓ API Key file structure OK"
          else
            echo "✗ Invalid API key format"
            exit 1
          fi

      - name: Build and Archive
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          xcodebuild archive \
            -project Moments.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Moments.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Validate Info.plist
        run: |
          APP_PATH="$RUNNER_TEMP/Moments.xcarchive/Products/Applications/Moments.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          
          echo "=== Validating Info.plist ==="
          
          if [ ! -f "$INFO_PLIST" ]; then
            echo "✗ Info.plist not found at $INFO_PLIST"
            exit 1
          fi
          
          echo "--- Full Info.plist contents ---"
          plutil -p "$INFO_PLIST"
          echo "--- End of Info.plist ---"
          
          # Check required privacy keys
          REQUIRED_KEYS=(
            "NSPhotoLibraryUsageDescription"
            "NSPhotoLibraryAddUsageDescription"
            "NSLocationWhenInUseUsageDescription"
          )
          
          MISSING=0
          for key in "${REQUIRED_KEYS[@]}"; do
            if plutil -extract "$key" raw "$INFO_PLIST" > /dev/null 2>&1; then
              VALUE=$(plutil -extract "$key" raw "$INFO_PLIST")
              echo "✓ $key: $VALUE"
            else
              echo "✗ MISSING: $key"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "ERROR: Required Info.plist keys are missing!"
            echo "The app will CRASH on launch when accessing PhotoKit."
            exit 1
          fi
          
          echo ""
          echo "✓ All required Info.plist keys present"

      - name: Build for Simulator (Smoke Test)
        run: |
          xcodebuild build \
            -project Moments.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -derivedDataPath "$RUNNER_TEMP/SimulatorBuild" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run Simulator Smoke Test
        run: |
          # Boot simulator
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          
          if [ -z "$DEVICE_ID" ]; then
            echo "Creating iPhone 16 simulator..."
            DEVICE_ID=$(xcrun simctl create "iPhone 16 Test" "iPhone 16")
          fi
          
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Using simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          
          # Wait for boot
          sleep 5
          
          # Install app
          APP_PATH="$RUNNER_TEMP/SimulatorBuild/Build/Products/Debug-iphonesimulator/Moments.app"
          echo "Installing app from: $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          
          # Launch app
          echo "Launching app..."
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          
          # Wait and check if still running
          echo "Waiting 15 seconds for app to stabilize..."
          sleep 15
          
          # Check if app is still running
          if xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "✓ App is still running after 15 seconds"
          else
            echo "✗ App appears to have crashed!"
            
            # Try to get crash log
            echo "=== Checking for crash logs ==="
            CRASH_DIR=~/Library/Logs/DiagnosticReports
            if ls "$CRASH_DIR"/Moments* 2>/dev/null; then
              echo "Found crash logs:"
              cat "$CRASH_DIR"/Moments* | head -100
            fi
            
            # Also check simulator logs
            xcrun simctl spawn "$DEVICE_ID" log show --predicate 'process == "Moments"' --last 1m --style compact || true
            
            exit 1
          fi

      - name: Generate and Seed Test Photos
        run: |
          echo "Generating test photos..."
          mkdir -p "$RUNNER_TEMP/test_photos"
          
          # Generate varied test images using sips and ImageMagick-like operations
          # Since swift scripts may not have access to AppKit on CI, we'll use simpler methods
          
          # Create screenshots (PNG, typical iPhone size)
          for i in $(seq 1 20); do
            convert -size 1170x2532 xc:"#$(printf '%06X' $((RANDOM * RANDOM % 16777215)))" \
              -gravity center -pointsize 72 -fill white -annotate 0 "Screenshot $i" \
              "$RUNNER_TEMP/test_photos/screenshot_$(printf '%03d' $i).png" 2>/dev/null || \
            sips -z 2532 1170 -s format png /System/Library/Desktop\ Pictures/*.heic -o "$RUNNER_TEMP/test_photos/screenshot_$(printf '%03d' $i).png" 2>/dev/null || \
            # Fallback: create with sips from a solid color
            printf '\x89PNG\r\n\x1a\n' > "$RUNNER_TEMP/test_photos/screenshot_$(printf '%03d' $i).png"
          done
          
          # Create test images using built-in macOS tools
          # Use screencapture or Preview to create test images
          for i in $(seq 1 150); do
            # Create simple colored JPEG files
            FILE="$RUNNER_TEMP/test_photos/test_$(printf '%03d' $i).jpg"
            
            # Use sips to create from system images or create minimal valid JPEG
            if [ -f "/System/Library/Desktop Pictures/Solid Colors/Black.png" ]; then
              cp "/System/Library/Desktop Pictures/Solid Colors/Black.png" "$FILE.tmp"
              sips -s format jpeg "$FILE.tmp" --out "$FILE" 2>/dev/null || true
              rm -f "$FILE.tmp"
            fi
            
            # If no image yet, create minimal JPEG
            if [ ! -f "$FILE" ] || [ ! -s "$FILE" ]; then
              # Minimal valid 1x1 JPEG
              printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xdb\x00C\x00\x08\x06\x06\x07\x06\x05\x08\x07\x07\x07\t\t\x08\n\x0c\x14\r\x0c\x0b\x0b\x0c\x19\x12\x13\x0f\x14\x1d\x1a\x1f\x1e\x1d\x1a\x1c\x1c $.\x27",#\x22\x1c\x1c(7teletech,01444teletech\xff\xc0\x00\x0b\x08\x00\x01\x00\x01\x01\x01\x11\x00\xff\xc4\x00\x1f\x00\x00\x01\x05\x01\x01\x01\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x01\x02\x03\x04\x05\x06\x07\x08\t\n\x0b\xff\xc4\x00\xb5\x10\x00\x02\x01\x03\x03\x02\x04\x03\x05\x05\x04\x04\x00\x00\x01}\x01\x02\x03\x00\x04\x11\x05\x12!1A\x06\x13Qa\x07"q\x142\x81\x91\xa1\x08#B\xb1\xc1\x15R\xd1\xf0$3br\x82\t\n\x16\x17\x18\x19\x1a%&\x27()*456789:CDEFGHIJSTUVWXYZcdefghijstuvwxyz\x83\x84\x85\x86\x87\x88\x89\x8a\x92\x93\x94\x95\x96\x97\x98\x99\x9a\xa2\xa3\xa4\xa5\xa6\xa7\xa8\xa9\xaa\xb2\xb3\xb4\xb5\xb6\xb7\xb8\xb9\xba\xc2\xc3\xc4\xc5\xc6\xc7\xc8\xc9\xca\xd2\xd3\xd4\xd5\xd6\xd7\xd8\xd9\xda\xe1\xe2\xe3\xe4\xe5\xe6\xe7\xe8\xe9\xea\xf1\xf2\xf3\xf4\xf5\xf6\xf7\xf8\xf9\xfa\xff\xda\x00\x08\x01\x01\x00\x00?\x00\xfb\xd5Q@\xff\xd9' > "$FILE"
            fi
          done
          
          echo "Created $(ls -1 $RUNNER_TEMP/test_photos/ | wc -l) test photos"
          
          # Add photos to simulator
          echo "Adding photos to simulator..."
          xcrun simctl addmedia "$DEVICE_ID" "$RUNNER_TEMP/test_photos"/* 2>/dev/null || true
          
          # Grant photo library permission
          echo "Granting photo permissions..."
          xcrun simctl privacy "$DEVICE_ID" grant photos "$BUNDLE_ID"
          xcrun simctl privacy "$DEVICE_ID" grant photos-add "$BUNDLE_ID"
          
          echo "✓ Test photos seeded and permissions granted"

      - name: Run UI Tests
        id: ui_tests
        continue-on-error: true
        run: |
          # Create screenshots directory
          mkdir -p "$RUNNER_TEMP/screenshots"
          
          echo "Running UI tests..."
          xcodebuild test \
            -project Moments.xcodeproj \
            -scheme Moments \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -testPlan MomentsUITests \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/ui_test_output.log" || true
          
          # Extract test results
          echo "=== UI Test Summary ==="
          grep -E "(Test Suite|Test Case|passed|failed)" "$RUNNER_TEMP/ui_test_output.log" | tail -50

      - name: Extract Screenshots from Test Results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          
          # Extract screenshots from xcresult bundle
          if [ -d "$RUNNER_TEMP/TestResults.xcresult" ]; then
            echo "Extracting screenshots from test results..."
            
            # Use xcresulttool to extract attachments
            xcrun xcresulttool get --path "$RUNNER_TEMP/TestResults.xcresult" \
              --format json > "$RUNNER_TEMP/test_results.json" 2>/dev/null || true
            
            # Try to export screenshots using xcparse if available
            if command -v xcparse &> /dev/null; then
              xcparse screenshots "$RUNNER_TEMP/TestResults.xcresult" "$RUNNER_TEMP/screenshots" || true
            fi
            
            # Fallback: manually capture current simulator state
            echo "Capturing simulator screenshots..."
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/screenshots/final_state.png" 2>/dev/null || true
          fi
          
          echo "Screenshots captured: $(ls -1 $RUNNER_TEMP/screenshots/ 2>/dev/null | wc -l)"

      - name: Run MomentsEngine Unit Tests
        continue-on-error: true
        run: |
          echo "Running MomentsEngine unit tests..."
          cd MomentsEngine
          swift test 2>&1 | tee "$RUNNER_TEMP/unit_test_output.log" || true
          
          echo "=== Unit Test Summary ==="
          grep -E "(Test Suite|Test Case|passed|failed|error)" "$RUNNER_TEMP/unit_test_output.log" | tail -30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/screenshots/
            ${{ runner.temp }}/ui_test_output.log
            ${{ runner.temp }}/unit_test_output.log
          retention-days: 14

      - name: Shutdown Simulator
        if: always()
        run: |
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "=== ExportOptions.plist ==="
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Moments.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Moments.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moments-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Moments.xcarchive
          retention-days: 14

      - name: Clean up
        if: always()
        run: |
          rm -rf ~/private_keys
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
