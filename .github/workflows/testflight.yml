name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # One group per ref so two open PRs do not cancel each other's tests.
  # A new push on the same PR still cancels that PR's leftover run.
  # Main pushes keep cancel-in-progress false so a later merge cannot
  # kill a TestFlight upload that already passed unit + UI.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  SCHEME: Moments
  BUNDLE_ID: com.sbuffose.moments
  TEAM_ID: R56Y2GZ2M9
  PROFILE_NAME: "Moments AppStore GHA"
  PROFILE_UUID: "e32b0b74-6a42-45fe-9652-75ba4c9d7537"
  XCODE_VERSION: latest-stable

jobs:
  # Job 1: Build (shared by all downstream jobs)
  build:
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      build_number: ${{ steps.set_build_number.outputs.build_number }}
      device_id: ${{ steps.boot_simulator.outputs.device_id }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        id: set_build_number
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Project generated with build number $BUILD_NUMBER"

      - name: Create Simulator
        id: create_sim
        run: |
          echo "Available iOS runtimes:"
          xcrun simctl list runtimes iOS
          
          RUNTIME=$(xcrun simctl list runtimes iOS | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
          echo "Using runtime: $RUNTIME"
          
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          
          if [ -z "$DEVICE_ID" ]; then
            echo "Creating iPhone 15 Pro simulator..."
            DEVICE_ID=$(xcrun simctl create "iPhone 15 Pro" "iPhone 15 Pro" "$RUNTIME" 2>/dev/null || \
                        xcrun simctl create "iPhone 15" "iPhone 15" "$RUNTIME" 2>/dev/null || \
                        xcrun simctl create "iPhone 14 Pro" "iPhone 14 Pro" "$RUNTIME")
          fi
          
          echo "device_id=$DEVICE_ID" >> $GITHUB_OUTPUT
          echo "Created/found simulator: $DEVICE_ID"

      - name: Build for Simulator
        run: |
          DEVICE_ID="${{ steps.create_sim.outputs.device_id }}"
          xcodebuild build \
            -project Moments.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/SimulatorBuild" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Record Simulator ID
        id: boot_simulator
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.create_sim.outputs.device_id }}"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Build uses simulator $DEVICE_ID. Photo fixtures are seeded in the UI-test job."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build
          path: ${{ runner.temp }}/SimulatorBuild
          retention-days: 1

  # Job 2: Unit Tests (runs after build)
  unit-tests:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          BUILD_NUMBER=${{ needs.build.outputs.build_number }}
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: simulator-build
          path: ${{ runner.temp }}/SimulatorBuild

      - name: Setup Simulator for Unit Tests
        id: setup_sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes iOS | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl create "iPhone 15 Pro" "iPhone 15 Pro" "$RUNTIME" 2>/dev/null || \
                        xcrun simctl create "iPhone 15" "iPhone 15" "$RUNTIME")
          fi
          
          echo "device_id=$DEVICE_ID" >> $GITHUB_OUTPUT
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          sleep 3

      - name: Verify test-gate parser
        run: |
          set -euo pipefail
          FAIL_LOG="$RUNNER_TEMP/gate-fail.log"
          OK_LOG="$RUNNER_TEMP/gate-ok.log"
          printf '%s\n' "Testing cancelled because the build failed." > "$FAIL_LOG"
          printf '%s\n' "Executed 62 tests, with 0 failures (0 unexpected) in 1.2 seconds" > "$OK_LOG"
          if python3 scripts/ci/parse_xcresult.py --log "$FAIL_LOG" --min-tests 50 --label unit; then
            echo "FAIL: parser accepted a cancelled test build"
            exit 1
          fi
          if python3 scripts/ci/parse_xcresult.py --log "$OK_LOG" --min-tests 200 --label unit; then
            echo "FAIL: parser accepted a run below the minimum"
            exit 1
          fi
          python3 scripts/ci/parse_xcresult.py --log "$OK_LOG" --min-tests 50 --label unit

      - name: Run Unit Tests (MomentsTests)
        id: unit_tests
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.setup_sim.outputs.device_id }}"
          mkdir -p "$RUNNER_TEMP/test-results"
          set +e
          xcodebuild test \
            -project Moments.xcodeproj \
            -scheme Moments \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:MomentsTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/test-results/UnitTests.xcresult" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/unit_test_output.log"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e
          echo "=== Unit Test Summary ===" | tee "$RUNNER_TEMP/unit_test_summary.txt"
          grep -E "(Test Suite|Test Case|passed|failed|Executed)" "$RUNNER_TEMP/unit_test_output.log" | tail -30 | tee -a "$RUNNER_TEMP/unit_test_summary.txt" || true
          python3 scripts/ci/parse_xcresult.py \
            --bundle "$RUNNER_TEMP/test-results/UnitTests.xcresult" \
            --log "$RUNNER_TEMP/unit_test_output.log" \
            --min-tests 50 \
            --label unit \
            --summary-out "$RUNNER_TEMP/unit_test_summary.txt"
          # Parser is the gate. xcodebuild 65 after a green run is a
          # simulator restart, not a failed test.
          if [ "$XCODE_STATUS" -ne 0 ]; then
            echo "xcodebuild test exited with $XCODE_STATUS (ignored; unit parser passed)"
          fi

      - name: Run MomentsEngine Unit Tests
        run: |
          set -euo pipefail
          set +e
          (cd MomentsEngine && swift test) 2>&1 | tee "$RUNNER_TEMP/engine_test_output.log"
          ENGINE_STATUS=${PIPESTATUS[0]}
          set -e
          echo "=== Engine Test Summary ===" | tee -a "$RUNNER_TEMP/unit_test_summary.txt"
          grep -E "(Test Suite|Test Case|passed|failed|Executed)" "$RUNNER_TEMP/engine_test_output.log" | tail -20 | tee -a "$RUNNER_TEMP/unit_test_summary.txt" || true
          python3 scripts/ci/parse_xcresult.py \
            --log "$RUNNER_TEMP/engine_test_output.log" \
            --min-tests 10 \
            --label engine \
            --summary-out "$RUNNER_TEMP/unit_test_summary.txt"
          if [ "$ENGINE_STATUS" -ne 0 ]; then
            echo "swift test exited with $ENGINE_STATUS"
            exit "$ENGINE_STATUS"
          fi

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            ${{ runner.temp }}/test-results/
            ${{ runner.temp }}/unit_test_output.log
            ${{ runner.temp }}/engine_test_output.log
            ${{ runner.temp }}/unit_test_summary.txt
          retention-days: 14

  # Job 3: UI Tests / Smoke Suite (runs after build)
  ui-tests:
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          BUILD_NUMBER=${{ needs.build.outputs.build_number }}
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: simulator-build
          path: ${{ runner.temp }}/SimulatorBuild

      - name: Setup Simulator and Seed Test Fixtures
        id: setup_sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes iOS | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl create "iPhone 15 Pro" "iPhone 15 Pro" "$RUNTIME" 2>/dev/null || \
                        xcrun simctl create "iPhone 15" "iPhone 15" "$RUNTIME")
          fi
          
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          sleep 5
          
          echo "Generating distinctive fixture photos..."
          python3 scripts/ci/generate_fixture_photos.py "$RUNNER_TEMP/fixture_photos"
          
          xcrun simctl privacy "$DEVICE_ID" grant photos "$BUNDLE_ID"
          xcrun simctl privacy "$DEVICE_ID" grant photos-add "$BUNDLE_ID"
          
          shopt -s nullglob
          cd "$RUNNER_TEMP/fixture_photos"
          images=(*.jpg *.jpeg *.png)
          if [ "${#images[@]}" -lt 10 ]; then
            echo "FAIL: expected at least 10 fixture images, got ${#images[@]}"
            exit 1
          fi
          xcrun simctl addmedia "$DEVICE_ID" "${images[@]}"
          if [ -f clip_short.mp4 ]; then
            xcrun simctl addmedia "$DEVICE_ID" clip_short.mp4 || echo "video addmedia skipped; SwiftData seeder still provides a video"
          fi
          
          xcrun simctl spawn "$DEVICE_ID" defaults write -g AppleLanguages -array "es-AR" "es" "en"
          xcrun simctl spawn "$DEVICE_ID" defaults write -g AppleLocale -string "es_AR"
          
          echo "✓ Simulator ready with ${#images[@]} fixture images on one device"

      - name: Run UI Smoke Tests
        id: ui_tests
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.setup_sim.outputs.device_id }}"
          mkdir -p "$RUNNER_TEMP/screenshots"
          mkdir -p "$RUNNER_TEMP/test-results"
          set +e
          xcodebuild test \
            -project Moments.xcodeproj \
            -scheme Moments \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:MomentsUITests/SmokeTestSuite \
            -only-testing:MomentsUITests/MomentsUITests \
            -only-testing:MomentsUITests/ScreenshotTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath "$RUNNER_TEMP/test-results/UITests.xcresult" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/ui_test_output.log"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e
          echo "=== UI Test Summary ===" | tee "$RUNNER_TEMP/ui_test_summary.txt"
          grep -E "(Test Suite|Test Case|passed|failed|Executed)" "$RUNNER_TEMP/ui_test_output.log" | tail -50 | tee -a "$RUNNER_TEMP/ui_test_summary.txt" || true
          python3 scripts/ci/parse_xcresult.py \
            --bundle "$RUNNER_TEMP/test-results/UITests.xcresult" \
            --log "$RUNNER_TEMP/ui_test_output.log" \
            --min-tests 9 \
            --label ui \
            --summary-out "$RUNNER_TEMP/ui_test_summary.txt"
          if [ "$XCODE_STATUS" -ne 0 ]; then
            echo "xcodebuild test exited with $XCODE_STATUS"
            exit "$XCODE_STATUS"
          fi

      - name: Extract Screenshots from xcresult
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          
          if [ -d "$RUNNER_TEMP/test-results/UITests.xcresult" ]; then
            # Try xcparse for screenshots
            brew install chargepoint/xcparse/xcparse 2>/dev/null || true
            
            if command -v xcparse &> /dev/null; then
              xcparse screenshots "$RUNNER_TEMP/test-results/UITests.xcresult" "$RUNNER_TEMP/screenshots" 2>/dev/null || true
            fi
            
            # Also try xcresulttool
            xcrun xcresulttool export \
              --path "$RUNNER_TEMP/test-results/UITests.xcresult" \
              --output-path "$RUNNER_TEMP/xcexport" \
              --type file 2>/dev/null || true
            
            if [ -d "$RUNNER_TEMP/xcexport" ]; then
              find "$RUNNER_TEMP/xcexport" -name "*.png" -type f -exec cp {} "$RUNNER_TEMP/screenshots/" \; 2>/dev/null || true
            fi
          fi
          
          # Count screenshots
          SCREENSHOT_COUNT=$(ls -1 "$RUNNER_TEMP/screenshots/"*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "Extracted $SCREENSHOT_COUNT screenshots"

      - name: Shutdown Simulator
        if: always()
        run: |
          DEVICE_ID="${{ steps.setup_sim.outputs.device_id }}"
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true

      - name: Upload UI Test Results and Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            ${{ runner.temp }}/test-results/
            ${{ runner.temp }}/screenshots/
            ${{ runner.temp }}/ui_test_output.log
            ${{ runner.temp }}/ui_test_summary.txt
          retention-days: 14

  design-tour:
    needs: build
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          BUILD_NUMBER=${{ needs.build.outputs.build_number }}
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate

      - name: Run DesignTour on iPhone 16 Pro and SE
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/design-tour"
          RUNTIME=$(xcrun simctl list runtimes iOS | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
          echo "Using runtime $RUNTIME"

          create_or_find() {
            local NAME="$1"
            local TYPE="$2"
            local ID
            ID=$(xcrun simctl list devices available | grep "$NAME" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()' || true)
            if [ -z "$ID" ]; then
              ID=$(xcrun simctl create "$NAME" "$TYPE" "$RUNTIME")
            fi
            echo "$ID"
          }

          PRO_ID=$(create_or_find "iPhone 16 Pro" "iPhone 16 Pro")
          if [ -z "$PRO_ID" ]; then
            PRO_ID=$(create_or_find "iPhone 15 Pro" "iPhone 15 Pro")
          fi
          SE_ID=$(create_or_find "iPhone SE (3rd generation)" "iPhone SE (3rd generation)")
          if [ -z "$SE_ID" ]; then
            SE_ID=$(xcrun simctl create "iPhone SE DesignTour" "com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation" "$RUNTIME" 2>/dev/null || \
                    xcrun simctl create "iPhone SE DesignTour" "iPhone SE (3rd generation)" "$RUNTIME" 2>/dev/null || \
                    xcrun simctl list devices available | grep -i "SE" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          fi
          echo "pro=$PRO_ID se=$SE_ID"
          if [ -z "$PRO_ID" ] || [ -z "$SE_ID" ]; then
            echo "FAIL: could not create iPhone 16 Pro and iPhone SE simulators"
            xcrun simctl list devicetypes | grep -i iphone
            exit 1
          fi

          run_tour() {
            local DEVICE_ID="$1"
            local SLUG="$2"
            xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
            sleep 4
            xcrun simctl privacy "$DEVICE_ID" grant photos "$BUNDLE_ID" || true
            xcrun simctl privacy "$DEVICE_ID" grant photos-add "$BUNDLE_ID" || true
            xcrun simctl spawn "$DEVICE_ID" defaults write -g AppleLanguages -array "es-AR" "es" "en"
            xcrun simctl spawn "$DEVICE_ID" defaults write -g AppleLocale -string "es_AR"
            mkdir -p "$RUNNER_TEMP/design-tour" "$RUNNER_TEMP/test-results"
            set +e
            xcodebuild test \
              -project Moments.xcodeproj \
              -scheme Moments \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              -only-testing:MomentsUITests/DesignTourTests \
              -parallel-testing-enabled NO \
              -resultBundlePath "$RUNNER_TEMP/test-results/DesignTour-$SLUG.xcresult" \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              TEST_RUNNER_UITEST_DEVICE_SLUG="$SLUG" \
              TEST_RUNNER_UITEST_SCREENSHOT_DIR="$RUNNER_TEMP/design-tour" \
              2>&1 | tee "$RUNNER_TEMP/design_tour_${SLUG}.log"
            local STATUS=${PIPESTATUS[0]}
            set -e
            python3 scripts/ci/parse_xcresult.py \
              --bundle "$RUNNER_TEMP/test-results/DesignTour-$SLUG.xcresult" \
              --log "$RUNNER_TEMP/design_tour_${SLUG}.log" \
              --min-tests 2 \
              --label ui \
              --summary-out "$RUNNER_TEMP/design_tour_${SLUG}_summary.txt"
            if [ "$STATUS" -ne 0 ]; then
              echo "xcodebuild test exited with $STATUS for $SLUG"
              exit "$STATUS"
            fi
            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          }

          run_tour "$PRO_ID" "iphone16pro"
          run_tour "$SE_ID" "iphonese"

          COUNT=$(ls -1 "$RUNNER_TEMP/design-tour/"*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "Design tour PNG count: $COUNT"
          if [ "$COUNT" -lt 8 ]; then
            echo "FAIL: expected design-tour screenshots, got $COUNT"
            exit 1
          fi

      - name: Upload design-tour artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-tour
          path: ${{ runner.temp }}/design-tour/
          retention-days: 14

  # Job 4: TestFlight Upload
  # CRITICAL: Depends on unit, UI, and the design tour passing
  # An upload is IMPOSSIBLE if any test fails
  testflight:
    needs: [build, unit-tests, ui-tests, design-tour]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    concurrency:
      group: testflight-main
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          BUILD_NUMBER=${{ needs.build.outputs.build_number }}
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate
          echo "Project generated with build number $BUILD_NUMBER"

      - name: Setup Keychain and Import Certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          
          security import "$CERT_PATH" \
            -P "$DIST_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          
          rm "$CERT_PATH"
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -5
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"
          
          PROFILE_PATH="$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          
          echo "=== Provisioning profile installed ==="
          echo "Path: $PROFILE_PATH"

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          
          echo "$ASC_PRIVATE_KEY" | awk '{gsub(/\\n/,"\n")}1' | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          
          if head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "✓ API Key file structure OK"
          else
            echo "✗ Invalid API key format"
            exit 1
          fi

      - name: Build and Archive
        run: |
          BUILD_NUMBER=${{ needs.build.outputs.build_number }}
          xcodebuild archive \
            -project Moments.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Moments.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Validate Info.plist
        run: |
          APP_PATH="$RUNNER_TEMP/Moments.xcarchive/Products/Applications/Moments.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          
          REQUIRED_KEYS=(
            "NSPhotoLibraryUsageDescription"
            "NSPhotoLibraryAddUsageDescription"
            "NSLocationWhenInUseUsageDescription"
          )
          
          MISSING=0
          for key in "${REQUIRED_KEYS[@]}"; do
            if plutil -extract "$key" raw "$INFO_PLIST" > /dev/null 2>&1; then
              VALUE=$(plutil -extract "$key" raw "$INFO_PLIST")
              echo "✓ $key: $VALUE"
            else
              echo "✗ MISSING: $key"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi
          
          echo "✓ All required Info.plist keys present"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Moments.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Moments.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moments-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Moments.xcarchive
          retention-days: 14

      - name: Clean up
        if: always()
        run: |
          rm -rf ~/private_keys
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
