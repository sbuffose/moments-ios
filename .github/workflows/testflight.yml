name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SCHEME: Moments
  BUNDLE_ID: com.sbuffose.moments
  TEAM_ID: R56Y2GZ2M9
  PROFILE_NAME: "Moments AppStore GHA"
  PROFILE_UUID: "e32b0b74-6a42-45fe-9652-75ba4c9d7537"

jobs:
  build-and-deploy:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate
          echo "Project generated with build number ${{ github.run_number }}"

      - name: Setup Keychain and Import Certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Set as default keychain
          security default-keychain -s "$KEYCHAIN_PATH"
          
          # Decode and import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          
          security import "$CERT_PATH" \
            -P "$DIST_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          
          rm "$CERT_PATH"
          
          # Set keychain partition list for codesign access
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to search list (make sure our keychain is first)
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          
          # Verify certificate imported
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -5
          
          # Store keychain path for later steps (mask password in logs)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"
          
          PROFILE_PATH="$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          
          echo "=== Provisioning profile installed ==="
          echo "Path: $PROFILE_PATH"
          echo "Size: $(wc -c < "$PROFILE_PATH") bytes"

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          
          echo "$ASC_PRIVATE_KEY" | awk '{gsub(/\\n/,"\n")}1' | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          
          # Validate key file structure
          if head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "✓ API Key file structure OK"
          else
            echo "✗ Invalid API key format"
            exit 1
          fi

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project Moments.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Moments.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "=== ExportOptions.plist ==="
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          # Ensure keychain is unlocked for export
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Moments.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Moments.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moments-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Moments.xcarchive
          retention-days: 14

      - name: Clean up
        if: always()
        run: |
          rm -rf ~/private_keys
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
